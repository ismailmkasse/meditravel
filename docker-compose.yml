services:
  db:
    image: postgres:16
    container_name: meditravel_db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: meditravel
    ports:
      - "5432:5432"
    volumes:
      - meditravel_db_data:/var/lib/postgresql/data
volumes:
  meditravel_db_data:
